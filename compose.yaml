name: lawang-go

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawang}
      POSTGRES_DB: ${POSTGRES_DB:-lawang_db_go}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - lawang_go_postgres_data:/var/lib/postgresql
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lawang-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lawang-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - lawang_go_minio_data:/data
  fake-provider:
    build:
      context: .
      target: fake-provider
    environment:
      FAKE_HTTP_ADDRESS: ":8081"
      CALLBACK_TIMEOUT: "2s"
      SHUTDOWN_TIMEOUT: "10s"
      LOG_LEVEL: "info"
      PROVIDER_WEBHOOK_SECRET: "${PROVIDER_WEBHOOK_SECRET}"
    ports:
      - "${FAKE_PROVIDER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/live"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

volumes:
  lawang_go_postgres_data:
    name: lawang_go_postgres_data
  lawang_go_minio_data:
    name: lawang_go_minio_data
