name: lawang-go

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawang}
      POSTGRES_DB: ${POSTGRES_DB:-lawang_db_go}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - lawang_go_postgres_data:/var/lib/postgresql

volumes:
  lawang_go_postgres_data:
    name: lawang_go_postgres_data
